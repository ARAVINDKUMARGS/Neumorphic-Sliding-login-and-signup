
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetaSkillGroup Login and Signup</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="container" id="container">

        <div class="mobile-switch-nav">

            <button type="button" class="mobile-tab-btn active" id="mobileSignInTab">
                Sign In
            </button>

            <button type="button" class="mobile-tab-btn" id="mobileSignUpTab">
                Sign Up
            </button>

        </div>

        <div class="form-container sign-up-container">

            <form id="signUpForm" novalidate>

                <h1>Create Account</h1>
                <p>Join MetaSkillGroup today</p>

                <div class="social-container">
                    <button type="button" class="social-btn">
                        <i class="fa-brands fa-google"></i>
                    </button>

                    <button type="button" class="social-btn">
                        <i class="fa-brands fa-github"></i>
                    </button>
                </div>

                <div class="divider">
                    <span>Register with your email</span>
                </div>

                <div class="feedback-alert" id="signupFeedback"></div>

                <div class="input-group">
                    <input type="text" id="signupName" placeholder="Full Name">
                    <small class="error-msg" id="signupNameError"></small>
                </div>

                <div class="input-group">
                    <input type="email" id="signupEmail" placeholder="Email Address">
                    <small class="error-msg" id="signupEmailError"></small>
                </div>

                <div class="input-group">
                    <input type="tel" id="signupPhone" placeholder="Phone Number">
                    <small class="error-msg" id="signupPhoneError"></small>
                </div>

                <div class="input-group">
                    <input type="password" id="signupPassword" placeholder="Password">

                    <button type="button" class="toggle-password" data-target="signupPassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                    <small class="error-msg" id="signupPasswordError"></small>
                </div>

                <div class="strength-meter-box">
                    <div class="strength-bar-track">
                        <div class="strength-bar-fill" id="strengthBarFill"></div>
                    </div>

                    <div class="strength-meta">
                        <span>Strength:</span>
                        <span class="strength-text" id="strengthLabel">Enter password</span>
                    </div>
                </div>

                <div class="input-group">
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password">

                    <button type="button" class="toggle-password" data-target="signupConfirmPassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                    <small class="error-msg" id="signupConfirmPasswordError"></small>
                </div>

                <div class="checkbox-row terms-row">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="signupTerms">
                        <span class="checkbox-box">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span class="checkbox-label">
                            I agree to the Terms and Privacy Policy
                        </span>
                    </label>

                    <small class="error-msg" id="signupTermsError"></small>
                </div>

                <button type="submit" class="btn btn-primary" id="signupSubmitBtn">
                    <span class="btn-text">Sign Up</span>
                    <i class="fa-solid fa-spinner fa-spin btn-spinner"></i>
                </button>

            </form>

        </div>

        <div class="form-container sign-in-container">

            <form id="signInForm" novalidate>

                <h1>Welcome Back</h1>
                <p>Login to your account</p>

                <div class="social-container">
                    <button type="button" class="social-btn">
                        <i class="fa-brands fa-google"></i>
                    </button>

                    <button type="button" class="social-btn">
                        <i class="fa-brands fa-github"></i>
                    </button>
                </div>

                <div class="divider">
                    <span>Sign in with email</span>
                </div>

                <div class="feedback-alert" id="loginFeedback"></div>

                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder="Email Address">
                    <small class="error-msg" id="loginEmailError"></small>
                </div>

                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password">

                    <button type="button" class="toggle-password" data-target="loginPassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                    <small class="error-msg" id="loginPasswordError"></small>
                </div>

                <div class="form-options-row">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkbox-box">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span class="checkbox-label">Remember me</span>
                    </label>

                    <a href="#forgot" class="text-link forgot-pass" id="forgotPassLink">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
                    <span class="btn-text">Sign In</span>
                    <i class="fa-solid fa-spinner fa-spin btn-spinner"></i>
                </button>

            </form>

        </div>

        <div class="overlay-container">

            <div class="overlay">

                <div class="overlay-panel overlay-left">
                    <div class="overlay-content">
                        <h2>Welcome Back!</h2>
                        <p>Already have an account? Sign in here.</p>

                        <button type="button" class="ghost-btn" id="signInToggle">
                            Sign In
                        </button>
                    </div>
                </div>

                <div class="overlay-panel overlay-right">
                    <div class="overlay-content">
                        <h2>Hello, Friend!</h2>
                        <p>Create an account and start your journey with us.</p>

                        <button type="button" class="ghost-btn" id="signUpToggle">
                            Sign Up
                        </button>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
